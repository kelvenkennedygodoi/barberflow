services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: barberflow
      POSTGRES_USER: barberflow
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-troque-esta-senha}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U barberflow -d barberflow"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data

  web:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DEBUG: "False"
      POSTGRES_DB: barberflow
      POSTGRES_USER: barberflow
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-troque-esta-senha}
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      DB_SSLMODE: disable
      USE_WHITENOISE: "True"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/saude/')"
        ]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

  whatsapp_worker:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DEBUG: "False"
      POSTGRES_DB: barberflow
      POSTGRES_USER: barberflow
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-troque-esta-senha}
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      DB_SSLMODE: disable
      USE_WHITENOISE: "True"
    depends_on:
      web:
        condition: service_healthy
    command:
      [
        "sh",
        "-c",
        "while true; do python manage.py processar_notificacoes_whatsapp --limite 100; sleep 300; done"
      ]

volumes:
  postgres_data:
